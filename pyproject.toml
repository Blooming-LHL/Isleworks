[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isleworks"
version = "0.1.0"
description = "A small, auditable island economy with bounded agent planning."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
isleworks = "isleworks.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"isleworks.interfaces" = ["web/*"]
