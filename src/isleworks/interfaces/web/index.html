<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isleworks · 岛屿观测台</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand"><span class="mark">◒</span>Isleworks</div><div class="tagline">一个会运转的小世界</div><div id="connection" class="connection">连接中…</div></header><main class="shell"><section class="hero"><div><p class="eyebrow">ISLAND OBSERVER</p><h1>看见一座岛如何<br><em>照料自己的明天</em></h1><p class="lede">观察居民、资源与选择在每个日子里留下的痕迹。</p></div><div class="hero-art" aria-hidden="true">☀<span>⌁</span><small>∿ ∿ ∿</small></div></section><section class="toolbar panel"><label for="run-select">观测运行</label><select id="run-select"><option>加载中…</option></select><button id="new-run" class="button primary">＋ 新建规则运行</button><button id="pause" class="button" disabled>暂停</button><button id="resume" class="button" disabled>继续</button><button id="step" class="button" disabled>走一步</button><span id="run-status" class="status-pill">等待选择</span></section><section id="scenario-dialog" class="panel dialog hidden"><strong>开始一段新的岛屿日记</strong><label>情景<select id="scenario"><option value="baseline">平稳海湾</option><option value="no-nets">没有渔网</option><option value="fishing-shock">捕鱼冲击</option></select></label><label>种子<input id="seed" type="number" value="42" min="0"></label><button id="launch" class="button primary">启航</button><button id="cancel-launch" class="button">取消</button></section><div id="error" class="alert hidden" role="alert"></div><div id="loading" class="loading">正在读取岛屿资料…</div><div id="dashboard" class="hidden"><section class="overview-grid"><div class="panel day-card"><div class="kicker">当前日程</div><div class="day-number"><span id="day">—</span><small>日</small></div><div class="progress"><span id="day-progress"></span></div><div id="day-label" class="muted">等待运行</div><div class="replay"><label for="day-slider">回看日记</label><input id="day-slider" type="range" min="0" max="1" value="1"><span id="slider-label">最新</span><button id="latest" class="link hidden">回到最新</button></div></div><div class="panel day-card"><div class="kicker">岛屿资源</div><div id="metrics" class="metrics"></div><div id="resource-note" class="muted"></div></div></section><section class="panel section"><div class="heading"><div><div class="kicker">六位居民</div><h2>他们今天在做什么</h2></div><span id="resident-count" class="muted"></span></div><div id="residents" class="resident-grid"></div></section><section class="lower-grid"><div class="panel section"><div class="heading"><div><div class="kicker">资源轨迹</div><h2>日常供给</h2></div><span class="muted">存粮 · 活跃居民</span></div><div id="chart" class="chart"></div></div><div class="panel section"><div class="kicker">岛屿广播</div><h2>最近发生的事</h2><div id="events" class="timeline"></div></div></section><section class="panel section"><div class="heading"><div><div class="kicker">选择的居民</div><h2 id="selected-name">点一张居民卡</h2></div><span id="selected-specialty" class="role"></span></div><div id="plan" class="plan-empty">选择居民后，这里会显示他的计划与资源。</div></section><section class="panel section"><div class="heading"><div><div class="kicker">运行复盘</div><h2>这座岛留下的报告</h2></div><span class="honest">居民使用规则 · 结束后自动复盘</span></div><div id="review"></div></section></div></main><footer>Isleworks · 可复现的规则模拟观测台</footer><script src="/review.js" defer></script><script src="/app.js" defer></script></body></html>
